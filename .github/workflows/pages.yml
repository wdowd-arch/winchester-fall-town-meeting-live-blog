name: Publish to GitHub Pages

# Publishing through Actions avoids the 10-builds-an-hour soft limit that
# applies to "Deploy from a branch". It takes effect once the repository's
# Settings > Pages > Source is set to "GitHub Actions". Until then, this
# workflow skips deployment and the branch-based publishing keeps working.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A push made while a deployment is running waits,
# and only the newest waiting push is published, so the latest feed wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "build_type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" = "legacy" ]; then
            echo "::notice::Pages source is still 'Deploy from a branch'; skipping. Set Settings > Pages > Source to GitHub Actions."
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.build_type != 'legacy'
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.build_type != 'legacy'
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.build_type != 'legacy'
        with:
          path: .
      - id: deployment
        if: steps.source.outputs.build_type != 'legacy'
        uses: actions/deploy-pages@v4
